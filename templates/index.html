<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graduation Ceremony</title>
</head>

<body style="
  margin:0;
  padding:0;
  background-color:#062F4F;
  font-family:Arial, Helvetica, sans-serif;
">

  <!-- Outer Container -->
  <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="background-color:#062F4F;">
    <tr>
      <td align="center" style="padding:30px 10px;">

        <!-- ========================= -->
        <!-- Main Invitation Card      -->
        <!-- ========================= -->

        <table role="presentation" width="600" border="0" cellspacing="0" cellpadding="0" style="
            width:600px;
            max-width:100%;
            background-color:#063B60;
            border:3px solid #F5B51B;
            color:#FFFFFF;
          ">

          <!-- Top Logo -->
          <tr>
            <td align="center" style="padding:45px 30px 25px 30px;">

              <img src="cid:logo_image" alt="Deerwalk DWIT College" width="220" style="
                  display:block;
                  width:220px;
                  max-width:80%;
                  height:auto;
                  margin:0 auto;
                ">

            </td>
          </tr>


          <!-- Invitation Text -->
          <tr>
            <td align="center" style="padding:35px 30px 10px 30px;">

              <p style="
                margin:0;
                color:#FFFFFF;
                font-size:18px;
                letter-spacing:3px;
                font-weight:300;
              ">
                YOU ARE INVITED TO
              </p>

            </td>
          </tr>


          <!-- Graduation Title -->
          <tr>
            <td align="center" style="padding:25px 20px 5px 20px;">

              <div style="
                color:#FFFFFF;
                font-family:Georgia, 'Times New Roman', serif;
                font-size:65px;
                line-height:0.95;
                font-style:italic;
                font-weight:normal;
              ">
                Graduation
              </div>

              <div style="
                color:#F5B51B;
                font-family:Arial, Helvetica, sans-serif;
                font-size:48px;
                line-height:1.1;
                font-weight:700;
                letter-spacing:1px;
              ">
                CEREMONY
              </div>

            </td>
          </tr>


          <!-- Class -->
          <tr>
            <td align="center" style="padding:20px 20px 35px 20px;">

              <p style="
                margin:0;
                color:#FFFFFF;
                font-family:Georgia, 'Times New Roman', serif;
                font-size:27px;
                font-style:italic;
              ">
                Class of 2025
              </p>

            </td>
          </tr>


          <!-- Personalized Name -->
          <tr>
            <td align="center" style="padding:20px 30px 10px 30px;">

              <p style="
                margin:0;
                color:#FFFFFF;
                font-family:Arial, Helvetica, sans-serif;
                font-size:32px;
                font-weight:400;
                letter-spacing:3px;
                text-transform:uppercase;
              ">
                {{Name}}
              </p>

            </td>
          </tr>


          <!-- Gold Divider -->
          <tr>
            <td align="center" style="padding:20px 40px 35px 40px;">

              <table role="presentation" width="80%" border="0" cellspacing="0" cellpadding="0">
                <tr>
                  <td style="
                    height:2px;
                    background-color:#F5B51B;
                    font-size:0;
                    line-height:0;
                  ">
                    &nbsp;
                  </td>
                </tr>
              </table>

            </td>
          </tr>


          <!-- Event Information -->
          <tr>
            <td align="center" style="padding:15px 30px 45px 30px;">

              <p style="
                margin:0 0 22px 0;
                color:#FFFFFF;
                font-size:22px;
                line-height:1.5;
                letter-spacing:1px;
              ">
                SATURDAY, 12 SEPTEMBER | 8:45 AM
              </p>

              <p style="
                margin:0;
                color:#FFFFFF;
                font-size:19px;
                line-height:1.6;
              ">
                Deerwalk Institute of Technology
              </p>

            </td>
          </tr>


          <!-- Bottom Decorative Divider -->
          <tr>
            <td align="center" style="padding:10px 30px 45px 30px;">

              <table role="presentation" width="65%" border="0" cellspacing="0" cellpadding="0">
                <tr>
                  <td style="
                    height:1px;
                    background-color:#F5B51B;
                    font-size:0;
                    line-height:0;
                  ">
                    &nbsp;
                  </td>
                </tr>
              </table>

              <p style="
                margin:8px 0 0 0;
                color:#F5B51B;
                font-size:20px;
              ">
                ✦
              </p>

            </td>
          </tr>

        </table>


        <!-- ========================= -->
        <!-- RSVP Note                  -->
        <!-- ========================= -->

        <table role="presentation" width="600" border="0" cellspacing="0" cellpadding="0"
          style="width:600px; max-width:100%;">
          <tr>
            <td align="center" style="padding:15px 20px 0 20px;">

              <p style="
                margin:0;
                color:#FFFFFF;
                font-family:Arial, Helvetica, sans-serif;
                font-size:13px;
                line-height:1.5;
                text-align:center;
              ">
                Kindly RSVP by Friday, August 28, 2026.
                Looking forward to seeing you there.
              </p>

            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>

</body>

</html>
