<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graduation Ceremony</title>
</head>

<body style="margin:0;padding:0;background-color:#FFFFFF;font-family:Arial,sans-serif;">
    <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0"
        style="background-color:#FFFFFF;padding:40px 0;">
        <tr>
            <td align="center">
                <table role="presentation" width="600" border="0" cellspacing="0" cellpadding="0"
                    style="background-color:#FFFFFF;border:3px solid #EA5D0F;color:#000000;text-align:center;padding:40px 30px;">
                    <tr>
                        <td>
                            <img src="../images/logo/logo.png" alt="Logo"
                                style="width:120px;margin-bottom:20px;">

                            <p style="font-size:1rem;color:#EA5D0F;letter-spacing:2px;margin:0;font-weight:600;">
                                You are cordially invited to
                            </p>

                            <h1 style="font-size:3rem;font-weight:normal;margin:10px 0 0 0;color:#000000;">
                                GRADUATION
                                <span style="color:#EA5D0F;display:block;">
                                    CEREMONY
                                </span>
                            </h1>

                            <p style="font-size:1.2rem;font-style:italic;color:#000000;margin:10px 0 0 0;">
                                Class of 2026
                            </p>

                            <h2 style="font-size:1.8rem;letter-spacing:2px;margin-top:40px;color:#EA5D0F;">
                                {{Name}}
                            </h2>

                            <div style="width:80%;height:2px;background:#EA5D0F;margin:20px auto;"></div>

                            <p style="font-size:1rem;letter-spacing:1px;margin-top:20px;color:#000000;line-height:1.6;">
                                Dress Code: <b>Formal</b><br><br>
                                Saturday<br>
                                July 11, 2026 | 8:00 AM<br>
                                Deerwalk Sifal School
                                
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
